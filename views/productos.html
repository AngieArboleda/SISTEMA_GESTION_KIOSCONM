<div class="productos-container">

    <div class="encabezado-productos">

        <h2>

            📦 Gestión de Productos

        </h2>

        <p>

            Sistema KIOSCO NM

        </p>

        <span>

            Administración de Inventario

        </span>

    </div>

    <!-- FORMULARIO -->

    <div class="card-producto">

        <h3>

            Nuevo Producto

        </h3>

        <form id="formProducto">

            <input
                type="text"
                id="codigoBarras"
                placeholder="Código de Barras"
                required
            >

            <input
                type="text"
                id="nombreProducto"
                placeholder="Nombre del Producto"
                required
            >

            <select id="categoria">

    <option value="Bebidas">Bebidas</option>
    <option value="Golosinas">Golosinas</option>
    <option value="Galletitas">Galletitas</option>
    <option value="Lácteos">Lácteos</option>
    <option value="Limpieza">Limpieza</option>
    <option value="Tabaco">Tabaco</option>
    <option value="Bebidas Alcoholicas">
        Bebidas Alcohólicas
    </option>
    <option value="Otros">Otros</option>

</select>

<select id="proveedor">

    <option value="">

        Seleccionar Proveedor

    </option>

</select>

<input
    type="number"
    id="costoUnitario"
    placeholder="Costo Unitario"
    min="0"
    step="0.01"
    required
>
            

            <input
                type="number"
                id="precio"
                placeholder="Precio Venta"
                required
            >

            <input
                type="number"
                id="stock"
                placeholder="Stock Actual"
                required
            >

            <input
                type="number"
                id="stockMinimo"
                placeholder="Stock Mínimo"
                required
            >

            <button
                type="submit"
                id="btnGuardarProducto"
            >

                💾 Guardar Producto

            </button>

        </form>

    </div>

    <!-- BUSCADOR -->

    <div class="card-busqueda">

        <div class="form-busqueda">

            <input
                type="text"
                id="buscarProducto"
                placeholder="🔍 Buscar producto..."
            >

            <button
                type="button"
                id="btnBuscarProducto"
                class="btnBuscar"
            >

                Buscar

            </button>

            <button
                type="button"
                id="btnLimpiarBusqueda"
                class="btnLimpiar"
            >

                Limpiar

            </button>

        </div>

    </div>

    <!-- TABLA -->

    <div class="tabla-productos-contenedor">

        <h3>

            Productos Registrados

        </h3>

        <table id="tablaProductos">

            <thead>

                <tr>

                    <th>Código</th>
                    <th>Nombre</th>
                    <th>Categoría</th>
                    <th>Precio</th>
                    <th>Stock</th>
                    <th>Mínimo</th>
                    <th>Estado</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>
