<div class="usuarios-container">

    <div class="usuarios-header">

        <div>

            <h2>

                👥 Gestión de Usuarios

            </h2>

            <p>

                Administración de usuarios y permisos

            </p>

        </div>

    </div>

    <div class="card-usuario">

        <form id="formUsuario">

            <input
                type="text"
                id="nombre"
                placeholder="Nombre"
                required
            >

            <input
                type="text"
                id="apellido"
                placeholder="Apellido"
                required
            >

            <input
                type="text"
                id="usuario"
                placeholder="Usuario"
                required
            >

            <div class="campo-password">

                <input
                    type="password"
                    id="password"
                    placeholder="Contraseña"
                    required
                >

                <span
                    id="togglePasswordUsuario"
                    class="toggle-password"
                    title="Mostrar contraseña"
                >
                    👁
                </span>

            </div>

            <select id="perfil">

                <option value="Administrador">

                    Administrador

                </option>

                <option value="Vendedor">

                    Vendedor

                </option>

                <option value="Personalizado">

                    Personalizado

                </option>

            </select>

            <div class="permisos-container">

                <h3>

                    Permisos del Usuario

                </h3>

                <div class="grupo-permisos">

                    <label><input type="checkbox" id="crearUsuario"> Crear Usuarios</label>
                    <label><input type="checkbox" id="editarUsuario"> Editar Usuarios</label>
                    <label><input type="checkbox" id="desactivarUsuario"> Desactivar Usuarios</label>
                    <label><input type="checkbox" id="crearProducto"> Crear Productos</label>
                    <label><input type="checkbox" id="editarProducto"> Editar Productos</label>
                    <label><input type="checkbox" id="desactivarProducto"> Desactivar Productos</label>
                    <label><input type="checkbox" id="ventas"> Ventas</label>
                    <label><input type="checkbox" id="inventario"> Inventario</label>
                    <label><input type="checkbox" id="proveedores"> Proveedores</label>
                    <label><input type="checkbox" id="caja"> Caja</label>
                    <label><input type="checkbox" id="reportes"> Reportes</label>

                </div>

            </div>

            <button type="submit">

                Guardar Usuario

            </button>

        </form>

    </div>

    <div class="card-busqueda">

        <input
            type="text"
            id="buscarUsuario"
            placeholder="Buscar usuario"
        >

        <button id="btnBuscarUsuario">

            🔍 Buscar

        </button>

        <button id="btnLimpiarBusquedaUsuario">

            Limpiar

        </button>

    </div>

    <div class="tabla-contenedor">

        <h3>

            Usuarios Registrados

        </h3>

        <table id="tablaUsuarios">

            <thead>

                <tr>

                    <th>Nombre</th>
                    <th>Apellido</th>
                    <th>Usuario</th>
                    <th>Contraseña</th>
                    <th>Perfil</th>
                    <th>Estado</th>
                    <th>Acciones</th>

                </tr>

            </thead>

            <tbody>

            </tbody>

        </table>

    </div>

</div>
