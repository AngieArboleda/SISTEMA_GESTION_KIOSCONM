    MÉTODO DE PAGO
===================================== -->
<div class="metodo-pago">

    <label>

        💳 Método de Pago

    </label>

    <select id="metodoPago">

        <option value="Efectivo">

        <option value="MercadoPago">

        </option>

        <option value="Tarjeta">

        </option>

        <option value="Mixto">

            Mixto

        </option>

    </select>

</div>

<div
    id="contenedorMetodoMixto"
    class="metodo-mixto"
    style="display:none;"
>

    <label>

        🔀 Combinación

    </label>

    <select id="tipoMixto">

        <option value="EfectivoTarjeta">

            Efectivo + Tarjeta

        </option>

        <option value="EfectivoMercadoPago">

            Efectivo + Mercado Pago

        </option>

    </select>
